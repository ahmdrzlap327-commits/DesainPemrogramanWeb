<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMPUS-Mini</title>
    <!-- Memanggil CSS yang sudah dibuat sejak Jobsheet 2 -->
    <link rel="stylesheet" href="assets/css/style.css"> 
</head>
<body>

    <header>
        <h1>SIMPUS-Mini</h1>
    </header>

    <main>
        <!-- Kode form login yang kita bahas tadi -->
        <section class="login-panel">
            <h2>Login Petugas</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="username">Username :</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username Anda">
                </div>
                
                <div class="form-group">
                    <label for="password">Password :</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password">
                </div>
                
                <button type="submit" class="btn-masuk">Masuk</button>
            </form>
            <br>
            <p>Belum punya akun? <a href="#">Daftar di sini</a></p>
        </section>
    </main>

</body>
</html>
