<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../assets/css/style.css">
    <title>SIMPUS-Mini - Tambah Buku</title>
</head>

<body>
    <header>
        <h1>SIMPUS-Mini</h1>

        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>

        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2></h2>
        <form id="form-tambah">
            <p>
                <label for="judul">Judul</label><br>
                <input type="text" id="judul" name="judul" required>
            </p>
            <p>
                <label for="pengarang">Pengarang</label><br>
                <input type="text" id="pengarang" name="pengarang" required>
            </p>
            <p>
                <label for="tahun">Tahun Terbit</label><br>
                <input type="number" id="tahun" name="tahun" min="1900" max="2026" required>
            </p>
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" placeholder="Masukkan 10 atau 13 digit ISBN">
            </div>
            <p>
                <label for="stok">Stok</label><br>
                <input type="number" id="stok" name="stok" min="0" required>
            </p>
            <p>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" name="kategori">
                    <option value="fiksi">Fiksi</option>
                    <option value="non-fiksi">Non-Fiksi</option>
                    <option value="referensi">Referensi</option>
                </select>
            </p>
            <p>
                <button type="submit">Simpan</button>
            </p>
        </form>
    </main>

    <footer>
        <p>© 2026 SIMPUS-Mini Jobsheet 1</p>
    </footer>

    <script src="../assets/js/app.js"></script>

</body>
</html>
